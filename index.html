<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>النسخة الاخيرة من النظام</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<script async src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script async src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script async src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script async src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script async src="https://cdnjs.cloudflare.com/ajax/libs/jsbarcode/3.12.3/JsBarcode.all.min.js"></script>
<style>
:root{
  --bg:#f4f6f9; --surface:#ffffff; --surface-2:#f8fafc; --border:#e3e8ef; --border-2:#cfd7e2;
  --ink:#111827; --ink-2:#4b5563; --muted:#8a94a6;
  --brand:#0f4c81; --brand-2:#1565a8; --brand-soft:#e8f1fa;
  --side:#0b2540; --side-2:#123456; --side-ink:#c9d6e6;
  --good:#0a7d48; --good-soft:#e6f5ee; --bad:#c0392b; --bad-soft:#fdecea; --warn:#b26a00; --warn-soft:#fff4e0;
  --s1:#2a78d6; --s2:#eb6834;
  --r:10px; --sh:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.08);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:'IBM Plex Sans Arabic',system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;direction:rtl}
button,input,select,textarea{font-family:inherit;font-size:14px}
.app{display:flex;min-height:100vh}
/* sidebar */
.side{width:250px;background:var(--side);color:var(--side-ink);flex-shrink:0;position:sticky;top:0;height:100vh;overflow-y:auto;transition:width .2s}
.brand{display:flex;align-items:center;gap:10px;padding:18px 18px 14px;border-bottom:1px solid rgba(255,255,255,.08)}
.brand .logo{width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,#2a78d6,#0f4c81);display:grid;place-items:center;color:#fff;font-weight:700;font-size:18px}
.brand b{display:block;color:#fff;font-size:15px}
.brand small{color:#8fa6c1;font-size:11.5px}
.nav-g{padding:10px 10px 4px}
.nav-g>div{font-size:11.5px;color:#7f97b3;padding:6px 10px;font-weight:600;letter-spacing:.3px}
.nav a{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:8px;color:var(--side-ink);text-decoration:none;font-size:13.5px;margin:1px 0}
.nav a:hover{background:rgba(255,255,255,.06);color:#fff}
.nav a.on{background:var(--brand-2);color:#fff}
.nav a svg{width:17px;height:17px;flex-shrink:0;opacity:.9}
/* main */
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{background:var(--surface);border-bottom:1px solid var(--border);padding:12px 24px;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:5}
.top h1{font-size:18px;margin:0;font-weight:700}
.top .sp{flex:1}
.sync{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block}
.sync.ok i{background:var(--good)} .sync.local i{background:var(--warn)}
.menu-btn{display:none}
.content{padding:22px 24px 60px;max-width:1500px;width:100%}
/* controls */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border-2);background:var(--surface);color:var(--ink);padding:7px 14px;border-radius:8px;cursor:pointer;font-weight:500;white-space:nowrap;text-decoration:none}
.btn:hover{background:var(--surface-2)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.pri:hover{background:var(--brand-2)}
.btn.ok{background:var(--good);border-color:var(--good);color:#fff}
.btn.dan{color:var(--bad);border-color:#f1c4bf}
.btn.dan:hover{background:var(--bad-soft)}
.btn.sm{padding:4px 9px;font-size:12.5px}
.btn.ghost{border-color:transparent;background:transparent}
.btn svg{width:15px;height:15px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.bar .sp{flex:1}
input.in,select.in,textarea.in{border:1px solid var(--border-2);border-radius:8px;padding:7px 10px;background:#fff;color:var(--ink);width:100%;min-width:0}
input.in:focus,select.in:focus,textarea.in:focus{outline:2px solid #bcd6f2;border-color:var(--brand-2)}
.search{max-width:280px}
.fld{display:flex;flex-direction:column;gap:5px}
.fld label{font-size:12.5px;color:var(--ink-2);font-weight:500}
.fld label .req{color:var(--bad)}
.grid{display:grid;gap:12px 16px;grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
.grid .wide{grid-column:1/-1}
.inline{display:flex;gap:8px;align-items:end;flex-wrap:wrap}
.inline .fld{min-width:150px}
/* cards */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--sh)}
.card-h{padding:13px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
.card-h h3{margin:0;font-size:15px}
.card-b{padding:16px 18px}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px;margin-bottom:18px}
.kpi{padding:16px 18px}
.kpi .l{font-size:12.5px;color:var(--ink-2);display:flex;align-items:center;gap:8px}
.kpi .l i{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;background:var(--brand-soft);color:var(--brand)}
.kpi .l i svg{width:16px;height:16px}
.kpi .v{font-size:23px;font-weight:700;margin-top:10px;direction:ltr;text-align:right;font-variant-numeric:tabular-nums}
.kpi .v small{font-size:12px;color:var(--muted);font-weight:500}
.kpi .s{font-size:12px;color:var(--muted);margin-top:4px}
.cols{display:grid;grid-template-columns:2fr 1fr;gap:16px}
.cols2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
/* tables */
.tw{overflow:auto}
table.t{width:100%;border-collapse:collapse;font-size:13.5px}
table.t th{background:var(--surface-2);color:var(--ink-2);font-weight:600;text-align:right;padding:9px 12px;border-bottom:1px solid var(--border);white-space:nowrap;font-size:12.5px;position:sticky;top:0}
table.t td{padding:8px 12px;border-bottom:1px solid #eef1f5;vertical-align:middle}
table.t tr:hover td{background:#fafcff}
table.t td.n,table.t th.n{text-align:left;direction:ltr;font-variant-numeric:tabular-nums;white-space:nowrap}
table.t tfoot td{font-weight:700;background:var(--surface-2);border-top:2px solid var(--border-2)}
table.t tr.grp td{font-weight:700;background:#f6f9fc}
table.t tr.sum td{font-weight:700;background:var(--brand-soft)}
table.t tr.sub td{font-weight:600;background:#fbfcfe}
.acts{white-space:nowrap;text-align:left}
.empty{padding:40px;text-align:center;color:var(--muted)}
.tag{display:inline-block;padding:2px 9px;border-radius:20px;font-size:12px;font-weight:500;background:#eef2f7;color:var(--ink-2)}
.tag.g{background:var(--good-soft);color:var(--good)} .tag.r{background:var(--bad-soft);color:var(--bad)} .tag.w{background:var(--warn-soft);color:var(--warn)} .tag.b{background:var(--brand-soft);color:var(--brand)}
.neg{color:var(--bad)}
.muted{color:var(--muted)}
.content a:not(.btn){color:var(--brand-2);text-decoration:none;font-weight:500}
.content a:not(.btn):hover{text-decoration:underline}
/* line editor */
.lines td{padding:5px 6px}
.lines input.in,.lines select.in{padding:6px 8px}
.totals{width:330px;margin-inline-start:auto}
.totals div{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px dashed var(--border)}
.totals div b{direction:ltr;font-variant-numeric:tabular-nums}
.totals .g{font-size:17px;font-weight:700;border-bottom:none;border-top:2px solid var(--ink);margin-top:4px;padding-top:9px}
/* modal */
.ov{position:fixed;inset:0;background:rgba(15,23,42,.45);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;z-index:50;overflow:auto}
.modal{background:#fff;border-radius:12px;width:100%;max-width:720px;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.modal.lg{max-width:1100px}
.modal .mh{padding:15px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center}
.modal .mh h3{margin:0;font-size:16px;flex:1}
.modal .mb{padding:18px 20px}
.modal .mf{padding:13px 20px;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:flex-start}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#111827;color:#fff;padding:11px 18px;border-radius:9px;z-index:99;box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:420px;font-size:13.5px}
.toast.err{background:var(--bad)}
/* tree */
.tree-name{display:inline-flex;align-items:center;gap:6px}
.code{font-family:ui-monospace,monospace;color:var(--ink-2);direction:ltr;display:inline-block}
/* chart */
.chart svg{width:100%;height:auto;display:block}
.legend{display:flex;gap:16px;font-size:12.5px;color:var(--ink-2);margin-bottom:6px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:11px;height:11px;border-radius:3px;display:inline-block}
.tip{position:fixed;pointer-events:none;background:#111827;color:#fff;font-size:12.5px;padding:7px 10px;border-radius:7px;z-index:60;white-space:nowrap}
/* printable document */
.doc{background:#fff;color:#111;width:794px;padding:36px 40px;font-size:12.5px;direction:rtl;font-family:'IBM Plex Sans Arabic',sans-serif}
.doc .dh{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:3px solid var(--brand);padding-bottom:14px;margin-bottom:16px;gap:20px}
.doc .dh h2{margin:0 0 4px;font-size:19px;color:var(--brand)}
.doc .dh .en{direction:ltr;text-align:left;color:#555}
.doc .dh img{max-height:70px;max-width:140px}
.doc .ttl{text-align:center;font-size:18px;font-weight:700;margin:6px 0 14px;padding:8px;background:var(--brand-soft);border-radius:6px;color:var(--brand)}
.doc .meta{display:grid;grid-template-columns:1fr 1fr;gap:6px 24px;margin-bottom:14px;border:1px solid #dde3ea;border-radius:8px;padding:10px 14px}
.doc .meta div span{color:#666;margin-inline-end:6px}
.doc table{width:100%;border-collapse:collapse;margin:8px 0}
.doc th{background:var(--brand);color:#fff;padding:7px 8px;font-weight:600;text-align:right;font-size:12px}
.doc td{padding:6px 8px;border-bottom:1px solid #e5e9ef}
.doc td.n,.doc th.n{text-align:left;direction:ltr;font-variant-numeric:tabular-nums}
.doc tr.grp td{font-weight:700;background:#f2f5f9}
.doc tr.sum td,.doc tfoot td{font-weight:700;background:#eaf1f8;border-top:1.5px solid #9bb3cc}
.doc .tot{width:300px;margin-inline-start:auto;margin-top:10px}
.doc .tot div{display:flex;justify-content:space-between;padding:5px 8px;border-bottom:1px solid #eee}
.doc .tot div b{direction:ltr}
.doc .tot .g{background:var(--brand);color:#fff;border-radius:5px;font-size:14px}
.doc .words{margin-top:12px;padding:8px 12px;background:#f7f9fb;border-right:3px solid var(--brand);font-weight:500}
.doc .sign{display:flex;justify-content:space-around;margin-top:46px;text-align:center}
.doc .sign div{border-top:1px solid #999;padding-top:6px;width:170px;color:#555}
.doc .foot{margin-top:24px;text-align:center;color:#777;font-size:11.5px;border-top:1px solid #e5e9ef;padding-top:8px}
.doc .rsub{text-align:center;color:#555;margin:-6px 0 12px}
#pdf-stage{position:fixed;top:0;left:-10000px}
#print-area{display:none}
@media print{
  body *{visibility:hidden}
  #print-area,#print-area *{visibility:visible}
  #print-area{display:block;position:absolute;inset:0}
  #print-area .doc{width:auto;padding:0}
  @page{size:A4;margin:12mm}
}
@media (max-width:980px){
  .side{position:fixed;right:0;z-index:40;transform:translateX(105%);transition:transform .2s}
  .side.open{transform:none}
  .menu-btn{display:inline-flex}
  .cols,.cols2{grid-template-columns:1fr}
  .content{padding:14px}
  .totals{width:100%}
}

.login-wrap{min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(160deg,#0b2540,#123456 55%,#1565a8)}
.login{width:100%;max-width:380px;padding:30px 28px;text-align:right}
.login h2{margin:10px 0 6px;font-size:20px}
.logo-big{width:56px;height:56px;border-radius:14px;background:linear-gradient(135deg,#2a78d6,#0f4c81);display:grid;place-items:center;color:#fff;font-weight:700;font-size:26px}
#who{margin-inline-start:10px}
.ro [data-a$="-new"],.ro [data-a$="-edit"],.ro [data-a$="-del"],.ro [data-a="lv-ok"],.ro [data-a="bc-gen-item"],.ro [data-a="demo"],.ro [data-a="set-save"],.ro [data-a="map-save"],.ro [data-a="bk-reset"],.ro #bk-in,.ro #logo-in{display:none!important}
.lines input.num{direction:ltr;text-align:left;padding:6px 6px}

/* POS */
.pos{display:grid;grid-template-columns:1fr 400px;gap:14px;height:calc(100vh - 110px);min-height:520px}
.pos-full .side{display:none}
.pos-full .content{max-width:none;padding:12px}
.pos-menu{display:flex;flex-direction:column;min-width:0;min-height:0}
.pos-top{display:flex;gap:8px;margin-bottom:10px}
.pos-top .in{flex:1;font-size:15px;padding:10px 12px}
.pos-cats{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.chip{border:1px solid var(--border-2);background:#fff;border-radius:20px;padding:7px 15px;cursor:pointer;font-weight:500;font-family:inherit;font-size:13.5px}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff}
.pos-grid{flex:1;overflow:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(138px,1fr));gap:10px;align-content:start;padding-bottom:10px}
.tile{border:1px solid rgba(15,23,42,.08);border-radius:12px;padding:14px 10px;min-height:92px;cursor:pointer;display:flex;flex-direction:column;justify-content:space-between;align-items:flex-start;text-align:right;font-family:inherit;transition:transform .08s,box-shadow .08s}
.tile:hover{box-shadow:0 3px 10px rgba(0,0,0,.08)}
.tile:active{transform:scale(.97)}
.tile b{font-size:14px;line-height:1.35;color:var(--ink)}
.tile span{font-size:15px;font-weight:700;color:var(--brand);direction:ltr}
.pos-cart{display:flex;flex-direction:column;min-height:0;overflow:hidden}
.pos-h{padding:12px;border-bottom:1px solid var(--border)}
.seg{display:flex;background:var(--surface-2);border:1px solid var(--border);border-radius:9px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:transparent;padding:8px;border-radius:7px;cursor:pointer;font-family:inherit;font-weight:600;color:var(--ink-2)}
.seg button.on{background:#fff;color:var(--brand);box-shadow:var(--sh)}
.seg.big button{padding:14px;font-size:15px}
.pos-meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:10px}
.pos-meta .in{flex:1;min-width:110px;padding:6px 8px}
.pos-lines{flex:1;overflow:auto;padding:4px 0}
.pl{display:flex;align-items:center;gap:8px;padding:9px 12px;border-bottom:1px solid #eef1f5}
.pl-n{flex:1;min-width:0}
.pl-note{font-size:12px;color:var(--warn)}
.pl-t{width:78px;text-align:left;direction:ltr;font-weight:600;font-variant-numeric:tabular-nums}
.qty{display:flex;align-items:center;gap:6px}
.qty button{width:30px;height:30px;border-radius:8px;border:1px solid var(--border-2);background:#fff;cursor:pointer;font-size:17px;line-height:1}
.qty b{min-width:22px;text-align:center}
.pos-tot{padding:10px 14px;border-top:1px solid var(--border);background:var(--surface-2)}
.pos-tot div{display:flex;justify-content:space-between;padding:2px 0}
.pos-tot b{direction:ltr;font-variant-numeric:tabular-nums}
.pos-tot .g{font-size:19px;font-weight:700;padding-top:6px}
.pos-btns{display:grid;grid-template-columns:1fr 1fr;gap:7px;padding:10px 12px}
.pos-btns .btn{justify-content:center}
.btn.pay{grid-column:1/-1;font-size:17px;padding:13px;justify-content:center}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.tables{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.tbl{border:2px solid #cfe3d6;background:#eefaf2;border-radius:12px;padding:14px 8px;cursor:pointer;font-family:inherit;display:flex;flex-direction:column;gap:4px;align-items:center}
.tbl b{font-size:15px}.tbl span{font-size:12px;color:var(--ink-2)}
.tbl.busy{border-color:#f3c3a8;background:#fff2ea}
.tbl.cur{outline:3px solid var(--brand)}
.orders{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.ocard{padding:12px 14px}
.change{margin-top:14px;font-size:17px;padding:12px;background:var(--brand-soft);border-radius:8px}
.change b{font-size:22px;direction:ltr;display:inline-block}
.big-in{font-size:20px!important;padding:10px!important;direction:ltr;text-align:left}
.rcpt{padding:12px 10px!important;font-size:11.5px;font-family:'IBM Plex Sans Arabic',sans-serif}
.rcpt hr{border:0;border-top:1px dashed #000;margin:6px 0}
.rcpt .rr{display:flex;justify-content:space-between;gap:8px;padding:1px 0}
.rcpt table td,.rcpt table th{font-size:11px}
tr.ret td{color:var(--bad)}
@media (max-width:980px){.pos{grid-template-columns:1fr;height:auto}.pos-grid{max-height:50vh}}
/* reservations calendar & POS scanner */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal-h{text-align:center;font-weight:600;color:var(--ink-2);font-size:12.5px;padding:4px}
.cal-d{min-height:104px;border:1px solid var(--border);border-radius:8px;padding:6px;cursor:pointer;background:#fff;overflow:hidden}
.cal-d:hover{border-color:var(--brand-2);box-shadow:var(--sh)}
.cal-d.empty{background:transparent;border:0;cursor:default;box-shadow:none}
.cal-d.today{border:2px solid var(--brand)}
.cal-n{font-weight:700;margin-bottom:4px;display:flex;gap:6px;align-items:center}
.cal-e{font-size:11.5px;padding:2px 5px;border-radius:4px;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:#eef2f7}
.cal-e.b{background:var(--brand-soft);color:var(--brand)}.cal-e.w{background:var(--warn-soft);color:var(--warn)}.cal-e.g{background:var(--good-soft);color:var(--good)}.cal-e.r{background:var(--bad-soft);color:var(--bad);text-decoration:line-through}
.scan{display:flex;align-items:center;gap:6px;background:#fff;border:2px solid var(--brand-2);border-radius:9px;padding:0 8px;min-width:210px}
.scan svg{width:20px;height:20px;color:var(--brand)}
.scan .in{border:0;outline:none!important;font-size:15px;padding:9px 4px}
#bell{margin-inline-start:8px}
@media (max-width:980px){.cal-d{min-height:70px}.cal-e{display:none}}
/* collapsible reservation reminders */
.rem-panel{position:fixed;bottom:22px;left:22px;z-index:45;width:340px;background:#fff;border:1px solid #b9d3ef;border-radius:12px;box-shadow:0 10px 30px rgba(15,23,42,.18);overflow:hidden}
.rem-panel.min{width:auto;background:transparent;border:0;box-shadow:none;overflow:visible}
.rem-h{display:flex;align-items:center;gap:6px;padding:8px 10px;background:var(--brand-soft);color:var(--brand)}
.rem-h svg{width:17px;height:17px}.rem-h .sp{flex:1}
.rem-b{max-height:300px;overflow:auto}
.rem-i{display:block;padding:8px 12px;border-bottom:1px solid #eef1f5;color:var(--ink)!important;text-decoration:none!important;font-size:13px}
.rem-i:hover{background:#fafcff}
.rem-pill{display:flex;align-items:center;gap:6px;background:var(--brand);color:#fff;border:0;border-radius:22px;padding:9px 16px;cursor:pointer;font-family:inherit;box-shadow:0 6px 18px rgba(15,76,129,.35);animation:pulse 2s infinite}
.rem-pill svg{width:16px;height:16px}
@keyframes pulse{0%,100%{box-shadow:0 6px 18px rgba(15,76,129,.35)}50%{box-shadow:0 6px 26px rgba(15,76,129,.6)}}
.pos-cats.sub{margin-top:-4px}.pos-cats.sub .chip{font-size:12.5px;padding:5px 12px;background:#f3f7fc}
.pos-cats.sub .chip.on{background:var(--brand-2);color:#fff}
@media (max-width:980px){.rem-panel{right:10px;left:10px;width:auto}}
.card-h h3 svg{width:18px;height:18px;vertical-align:-3px}
.card-b .sign{display:flex;justify-content:space-around;text-align:center;margin-top:30px}

/* ===== night mode ===== */

  --good:#3ecf8e;--good-soft:#12332a;--bad:#ff7b6e;--bad-soft:#3a1c1a;--warn:#f0b44c;--warn-soft:#3a2c12;--side-ink:#b9c7d8;

</style></head><body><script>
/* ===== Core accounting engine (no DOM) ===== */
const Core = (() => {
  const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-5);

  const KEYS = ['settings', 'accounts', 'customers', 'suppliers', 'items', 'groups', 'units', 'currencies', 'ccs', 'invoices', 'vouchers', 'journals', 'users', 'depts', 'employees', 'leaves', 'advances', 'payrolls', 'log', 'tables', 'posOrders', 'shifts', 'reservations', 'branches', 'warehouses', 'stockDocs', 'notifs', 'quotes', 'files'];

    ['2103', 'مصروفات مستحقة', 'liability', '21', 0], ['2104', 'رواتب مستحقة', 'liability', '21', 0], ['2105', 'التأمينات الاجتماعية المستحقة', 'liability', '21', 0], ['2106', 'عربون ودفعات مقدمة من العملاء', 'liability', '21', 0], ['2107', 'مشتريات مستلمة لم تصل فواتيرها', 'liability', '21', 0],

    ['5201', 'الرواتب والأجور', 'expense', '52', 0], ['5202', 'الإيجارات', 'expense', '52', 0],
    ['5203', 'الكهرباء والمياه', 'expense', '52', 0], ['5204', 'مصروفات عمومية وإدارية', 'expense', '52', 0],

  ];

  function defaultData() {
    const y = new Date().getFullYear();
    return {
      settings: {
        company: 'شركتي التجارية', companyEn: 'My Trading Co.', vatNo: '', crNo: '', address: 'الرياض - المملكة العربية السعودية',
        phone: '', email: '', base: 'SAR', vat: 15, openDate: y + '-01-01', footer: 'شكراً لتعاملكم معنا', allowNeg: false, logo: '',
        seq: { sale: 1, purchase: 1, sret: 1, pret: 1, receipt: 1, payment: 1, journal: 1, advance: 1, payroll: 1, pos: 1, shift: 1 },
        defWh: 'w1', posWh: 'w1',
        posCashAcc: 'a1101', posCardAcc: 'a1102', posPriceIncl: true, posCustomer: '', posCc: '', posAllowNeg: true, posNotes: 'بدون بصل، حار، بدون ثلج، إضافي جبن، صوص جانبي', posServiceTypes: true,
        map: { cash: 'a1101', bank: 'a1102', ar: 'a1103', inv: 'a1104', vatIn: 'a1105', ap: 'a2101', vatOut: 'a2102', open: 'a3103', sales: 'a4101', sret: 'a4102', cogs: 'a5101', adv: 'a1106', salPay: 'a2104', gosi: 'a2105', salExp: 'a5201', otherInc: 'a4103', custAdv: 'a2106', grni: 'a2107', invDiff: 'a5102', issueExp: 'a5204', prodOh: 'a5103' }
      },
      accounts: ACC.map(a => ({ id: 'a' + a[0], code: a[0], name: a[1], type: a[2], parent: a[3] ? 'a' + a[3] : null, group: !!a[4], cash: !!a[5], sys: true })),
      customers: [], suppliers: [],
      items: [],
      groups: [{ id: 'g1', code: '01', name: 'عام' }],
      units: [{ id: 'u1', name: 'حبة' }, { id: 'u2', name: 'كرتون' }, { id: 'u3', name: 'كيلو' }, { id: 'u4', name: 'لتر' }, { id: 'u5', name: 'علبة' }],

        { id: 'SAR', code: 'SAR', name: 'ريال سعودي', symbol: 'ر.س', rate: 1 },
        { id: 'USD', code: 'USD', name: 'دولار أمريكي', symbol: '$', rate: 3.75 },
        { id: 'EUR', code: 'EUR', name: 'يورو', symbol: '€', rate: 4.05 },

      invoices: [], vouchers: [], journals: [],
      users: [], depts: [{ id: 'd1', code: '01', name: 'الإدارة', cc: 'cc1' }, { id: 'd2', code: '02', name: 'المبيعات', cc: 'cc2' }], employees: [], leaves: [], advances: [], payrolls: [], log: [],
      tables: Array.from({ length: 12 }, (_, i) => ({ id: 't' + (i + 1), name: 'طاولة ' + (i + 1), section: i < 8 ? 'الصالة' : 'العائلات', seats: 4 })), posOrders: [], shifts: [], reservations: [],
      branches: [{ id: 'b1', code: '01', name: 'الفرع الرئيسي', cc: '' }], warehouses: [{ id: 'w1', code: '01', name: 'المستودع الرئيسي', branch: 'b1' }], stockDocs: []
    };
  }

  function normalize(D) {
    const def = defaultData();
    KEYS.forEach(k => { if (D[k] == null) D[k] = def[k] == null ? [] : def[k]; });
    D.settings = Object.assign({}, def.settings, D.settings);
    D.settings.seq = Object.assign({}, def.settings.seq, D.settings.seq);
    D.settings.map = Object.assign({}, def.settings.map, D.settings.map);
    // add new system accounts missing from older data
    def.accounts.forEach(a => { if (!D.accounts.some(x => x.id === a.id) && (!a.parent || D.accounts.some(x => x.id === a.parent))) D.accounts.push(a); });
    return D;
  }

  /* ---------- items & units ---------- */
  function unitFactor(item, unitId) {
    if (!item) return 1;
    if (!unitId || unitId === item.unit) return 1;
    const u = (item.alts || []).find(a => a.unit === unitId);
    return u ? (+u.factor || 1) : 1;
  }
  function itemUnits(item) {
    if (!item) return [];
    return [{ unit: item.unit, factor: 1, price: +item.price || 0 }].concat((item.alts || []).map(a => ({ unit: a.unit, factor: +a.factor || 1, price: +a.price || ((+item.price || 0) * (+a.factor || 1)) })));
  }

  /* ---------- invoice totals ---------- */
  function invTotals(inv) {
    const lines = (inv.lines || []).filter(l => l.item);
    let gross = 0;
    const ln = lines.map(l => { const g = r2((+l.qty || 0) * (+l.price || 0)); const net = r2(g - (+l.disc || 0)); gross += net; return { ...l, gross: g, net }; });
    gross = r2(gross);
    const disc = r2(+inv.disc || 0);
    const sub = r2(gross - disc);
    const vatRate = inv.vatOn === false ? 0 : (+inv.vatRate || 0);
    let sub2 = sub, vat, total;
    if (inv.vatIncl) { total = sub; sub2 = r2(total / (1 + vatRate / 100)); vat = r2(total - sub2); }
    else { vat = r2(sub * vatRate / 100); total = r2(sub + vat); }
    const subI = sub; return finish(sub2, vat, total, subI);
    function finish(sub, vat, total, subI) {
    const R = +inv.rate || 1;
    const subB = r2(sub * R), vatB = r2(vat * R), totB = r2(subB + vatB);
    // allocate base sub across lines (for inventory value)
    let acc = 0;
    ln.forEach((l, i) => {
      if (i === ln.length - 1) l.valB = r2(subB - acc);
      else { l.valB = gross ? r2(subB * l.net / gross) : 0; acc = r2(acc + l.valB); }
    });
    return { lines: ln, gross, disc, sub, vatRate, vat, total, subB, vatB, totB, R, incl: !!inv.vatIncl };
    }
  }

  const TYPE_LABEL = { prq: 'طلب شراء', quote: 'عرض سعر', prod: 'أمر إنتاج', request: 'طلب تحويل مخزني', po: 'أمر توريد', grn: 'استلام مخزني', issue: 'أمر صرف مخزني', transfer: 'تحويل مخزني', adjust: 'تسوية مخزن', sale: 'فاتورة مبيعات', purchase: 'فاتورة مشتريات', sret: 'مرتجع مبيعات', pret: 'مرتجع مشتريات', receipt: 'سند قبض', payment: 'سند صرف', journal: 'قيد يومية', open: 'رصيد افتتاحي', advance: 'سلفة موظف', payroll: 'مسير رواتب', salpay: 'صرف رواتب' };
  const PREFIX = { sale: 'INV', purchase: 'PUR', sret: 'SRT', pret: 'PRT', receipt: 'RV', payment: 'PV', journal: 'JV', advance: 'ADV', payroll: 'PAY', pos: 'ORD', shift: 'SH', res: 'RES', po: 'PO', grn: 'GRN', issue: 'ISS', transfer: 'TRF', adjust: 'ADJ', request: 'REQ', prod: 'MO', prq: 'PRQ', quote: 'QT' };

  /* ---------- ledger builder: everything derived from documents ---------- */
  function build(D) {
    const S = D.settings, M = S.map;
    const items = idx(D.items), cust = idx(D.customers), supp = idx(D.suppliers);
    const entries = [], moves = [], stock = {}, warnings = [];
    const st = id => stock[id] || (stock[id] = { qty: 0, val: 0, last: 0 });
    const whq = {}, defWh = S.defWh || 'w1'; let curWh = defWh;
    const addMove = m => { if (!m.wh) m.wh = curWh || defWh; moves.push(m); const k = m.item + '|' + m.wh; whq[k] = (whq[k] || 0) + (m.qin || 0) - (m.qout || 0); };
    const avgOf = s => s.qty > 0.0000001 ? s.val / s.qty : s.last;
    const od = S.openDate;
    const E = (o) => { o.lines = o.lines.filter(l => Math.abs(l.dr) > 0.0001 || Math.abs(l.cr) > 0.0001); if (o.lines.length) entries.push(o); };
    const L = (acc, dr, cr, extra) => Object.assign({ acc, dr: r2(dr), cr: r2(cr) }, extra || {});

    // opening stock
    let openStock = 0;
    D.items.forEach(it => {
      const q = +it.openQty || 0, c = +it.openCost || 0;
      if (q) { const s = st(it.id); const v = r2(q * c); s.qty += q; s.val += v; s.last = c; openStock = r2(openStock + v); addMove({ wh: it.openWh || defWh, date: od, item: it.id, kind: 'open', no: '-', desc: 'رصيد افتتاحي', qin: q, qout: 0, cost: c, value: v }); }
    });
    if (openStock) E({ id: 'open-stock', date: od, kind: 'open', no: 'OB', desc: 'رصيد افتتاحي للمخزون', lines: [L(M.inv, openStock, 0), L(M.open, 0, openStock)] });
    D.customers.forEach(c => { const b = r2(c.openBal); if (b) E({ id: 'open-c-' + c.id, date: od, kind: 'open', no: 'OB', desc: 'رصيد افتتاحي - ' + c.name, lines: [L(M.ar, b > 0 ? b : 0, b < 0 ? -b : 0, { pt: 'c', pid: c.id }), L(M.open, b < 0 ? -b : 0, b > 0 ? b : 0)] }); });
    D.suppliers.forEach(c => { const b = r2(c.openBal); if (b) E({ id: 'open-s-' + c.id, date: od, kind: 'open', no: 'OB', desc: 'رصيد افتتاحي - ' + c.name, lines: [L(M.ap, b < 0 ? -b : 0, b > 0 ? b : 0, { pt: 's', pid: c.id }), L(M.open, b > 0 ? b : 0, b < 0 ? -b : 0)] }); });
    D.accounts.forEach(a => { const b = r2(a.openBal); if (b && !a.group) E({ id: 'open-a-' + a.id, date: od, kind: 'open', no: 'OB', desc: 'رصيد افتتاحي - ' + a.name, lines: [L(a.id, b > 0 ? b : 0, b < 0 ? -b : 0), L(M.open, b < 0 ? -b : 0, b > 0 ? b : 0)] }); });

    const docs = [].concat(
      D.invoices.map(x => ({ k: x.type, x })), D.vouchers.map(x => ({ k: x.type, x })), D.journals.map(x => ({ k: 'journal', x })), (D.stockDocs || []).filter(x => x.type !== 'po' && x.type !== 'request' && x.type !== 'prq' && x.status !== 'cancelled' && !(x.type === 'prod' && x.status !== 'done')).map(x => ({ k: x.type, x }))
    ).sort((a, b) => a.x.date < b.x.date ? -1 : a.x.date > b.x.date ? 1 : ((a.x.created || 0) - (b.x.created || 0)));

    for (const { k, x } of docs) {
      const cc = x.cc || null;
      const base = { id: x.id, date: x.date, kind: k, no: x.no, docId: x.id, cc };
      curWh = x.wh || defWh;
      if (k === 'sale' || k === 'sret' || k === 'purchase' || k === 'pret') {
        const t = invTotals(x);
        const isS = k === 'sale' || k === 'sret';
        const party = isS ? cust[x.party] : supp[x.party];
        const pn = party ? party.name : '';
        const P = isS ? { pt: 'c', pid: x.party } : { pt: 's', pid: x.party };
        const lines = [];
        let costTot = 0;
        t.lines.forEach(l => {
          const it0 = items[l.item]; if (!it0) return;
          const bq0 = (+l.qty || 0) * unitFactor(it0, l.unit);
          // restaurant support: recipe items consume their ingredients; service items have no stock
          let parts = [[it0, bq0, '']];
          if (isS && it0.recipe && it0.recipe.length) parts = it0.recipe.filter(r => items[r.item]).map(r => [items[r.item], bq0 * (+r.qty || 0), ' (مكوّن: ' + it0.name + ')']);
          else if (isS && it0.service) parts = [];
          parts.forEach(([it, bq, note]) => {
          const s = st(it.id);
          if (k === 'sale') {
            const a = avgOf(s); const c = r2(bq * a);
            if (s.qty + 0.0000001 < bq) warnings.push(`رصيد غير كافٍ للصنف ${it.name} في ${x.no}`);
            s.qty -= bq; s.val -= c; s.last = a; if (Math.abs(s.qty) < 0.0000001) s.qty = 0;
            costTot = r2(costTot + c);
            addMove({ date: x.date, item: it.id, kind: k, no: x.no, doc: x.id, desc: 'مبيعات - ' + pn + note, qin: 0, qout: bq, cost: a, value: c });
          } else if (k === 'sret') {
            const a = avgOf(s) || (+it.cost || 0); const c = r2(bq * a);
            s.qty += bq; s.val += c; s.last = a; costTot = r2(costTot + c);
            addMove({ date: x.date, item: it.id, kind: k, no: x.no, doc: x.id, desc: 'مرتجع مبيعات - ' + pn + note, qin: bq, qout: 0, cost: a, value: c });
          } else if (k === 'purchase' && x.grn) {
            costTot = r2(costTot + l.valB);
          } else if (k === 'purchase') {
            const v = l.valB; s.qty += bq; s.val += v; s.last = bq ? v / bq : s.last; costTot = r2(costTot + v);
            addMove({ date: x.date, item: it.id, kind: k, no: x.no, doc: x.id, desc: 'مشتريات - ' + pn, qin: bq, qout: 0, cost: bq ? v / bq : 0, value: v });
          } else {
            const v = l.valB; const a = avgOf(s);
            if (s.qty + 0.0000001 < bq) warnings.push(`رصيد غير كافٍ للصنف ${it.name} في ${x.no}`);
            s.qty -= bq; s.val -= v; s.last = a; if (Math.abs(s.qty) < 0.0000001) s.qty = 0; costTot = r2(costTot + v);
            addMove({ date: x.date, item: it.id, kind: k, no: x.no, doc: x.id, desc: 'مرتجع مشتريات - ' + pn, qin: 0, qout: bq, cost: bq ? v / bq : 0, value: v });
          }
          });
        });
        const ccx = { cc };
        if (k === 'sale') {
          lines.push(L(M.ar, t.totB, 0, P), L(M.sales, 0, t.subB, ccx), L(M.vatOut, 0, t.vatB), L(M.cogs, costTot, 0, ccx), L(M.inv, 0, costTot));
          if (+x.advApply) { const a = r2(Math.min(+x.advApply, t.totB)); lines.push(L(M.custAdv, a, 0, P), L(M.ar, 0, a, P)); }
          if (x.pay === 'cash') {
            const pays = (x.payments || []).filter(p => +p.amount);
            if (pays.length) { let acc = 0; pays.forEach((p, i) => { const v = i === pays.length - 1 ? r2(t.totB - acc) : r2(+p.amount * (+x.rate || 1)); acc = r2(acc + v); lines.push(L(p.acc || M.cash, v, 0)); }); }
            else lines.push(L(x.cashAcc || M.cash, t.totB, 0));
            lines.push(L(M.ar, 0, t.totB, P));
          }
        } else if (k === 'sret') {
          lines.push(L(M.sret, t.subB, 0, ccx), L(M.vatOut, t.vatB, 0), L(M.ar, 0, t.totB, P), L(M.inv, costTot, 0), L(M.cogs, 0, costTot, ccx));
          if (x.pay === 'cash') lines.push(L(M.ar, t.totB, 0, P), L(x.cashAcc || M.cash, 0, t.totB));
        } else if (k === 'purchase') {
          lines.push(L(x.grn ? M.grni : M.inv, t.subB, 0), L(M.vatIn, t.vatB, 0), L(M.ap, 0, t.totB, P));
          if (x.pay === 'cash') lines.push(L(M.ap, t.totB, 0, P), L(x.cashAcc || M.cash, 0, t.totB));
        } else {
          lines.push(L(M.ap, t.totB, 0, P), L(M.inv, 0, t.subB), L(M.vatIn, 0, t.vatB));
          if (x.pay === 'cash') lines.push(L(x.cashAcc || M.cash, t.totB, 0), L(M.ap, 0, t.totB, P));
        }
        E(Object.assign(base, { desc: TYPE_LABEL[k] + ' ' + x.no + (pn ? ' - ' + pn : ''), lines }));
      } else if (k === 'receipt' || k === 'payment') {
        const amt = r2((+x.amount || 0) * (+x.rate || 1));

  /* ---------- account helpers ---------- */
  function children(D, id) { return D.accounts.filter(a => a.parent === id).sort((a, b) => a.code.localeCompare(b.code)); }
  function descendants(D, id) { const out = []; const walk = p => children(D, p).forEach(c => { out.push(c.id); walk(c.id); }); walk(id); return out; }
  function tree(D) { const out = []; const walk = (p, lvl) => children(D, p).forEach(c => { out.push({ a: c, lvl }); walk(c.id, lvl + 1); }); walk(null, 0); return out; }
  const natureDr = t => t === 'asset' || t === 'expense';

  function flat(LG) { const out = []; LG.entries.forEach(e => e.lines.forEach(l => out.push(Object.assign({ date: e.date, no: e.no, kind: e.kind, desc: e.desc, eid: e.id, ecc: e.cc }, l)))); return out; }

  function sums(LG, filter) {
    const m = {};
    LG.entries.forEach(e => e.lines.forEach(l => { if (filter && !filter(e, l)) return; const s = m[l.acc] || (m[l.acc] = { dr: 0, cr: 0 }); s.dr += l.dr; s.cr += l.cr; }));
    return m;
  }

  function trialBalance(D, LG, from, to, levelMax) {
    const ob = sums(LG, e => from && e.date < from);
    const pr = sums(LG, e => (!from || e.date >= from) && (!to || e.date <= to));
    const rows = [];
    const agg = (id) => {
      const a = D.accounts.find(x => x.id === id);
      const ids = a.group ? descendants(D, id) : [id];
      let o = 0, d = 0, c = 0;
      ids.concat(a.group ? [] : []).forEach(i => { const A = D.accounts.find(x => x.id === i); if (A && A.group) return; const q = ob[i] || { dr: 0, cr: 0 }, p = pr[i] || { dr: 0, cr: 0 }; o += q.dr - q.cr; d += p.dr; c += p.cr; });

    };

      const v = agg(a.id);
      if (!v.o && !v.d && !v.c) return;
      rows.push({ a, lvl, ...v });

    const tot = { od: 0, oc: 0, d: 0, c: 0, cd: 0, cc: 0 };
    D.accounts.filter(a => !a.group).forEach(a => { const v = agg(a.id); if (v.o > 0) tot.od += v.o; else tot.oc -= v.o; tot.d += v.d; tot.c += v.c; if (v.cl > 0) tot.cd += v.cl; else tot.cc -= v.cl; });

  }

  function statement(D, LG, accIds, from, to, party) {
    const set = new Set(accIds);
    const all = flat(LG).filter(l => set.has(l.acc) && (!party || (l.pt === party.pt && l.pid === party.pid)));
    let open = 0; const rows = [];
    all.forEach(l => { if (from && l.date < from) open += l.dr - l.cr; });
    let bal = open;
    all.filter(l => (!from || l.date >= from) && (!to || l.date <= to)).sort((a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : 0)
      .forEach(l => { bal += l.dr - l.cr; rows.push({ ...l, bal: r2(bal) }); });
    const dr = r2(rows.reduce((s, l) => s + l.dr, 0)), cr = r2(rows.reduce((s, l) => s + l.cr, 0));
    return { open: r2(open), rows, dr, cr, close: r2(open + dr - cr) };
  }

  function partyBalance(D, LG, pt, pid, to) {
    const M = D.settings.map; const accs = pt === 'c' ? [M.ar, M.custAdv] : pt === 's' ? [M.ap] : [M.adv, M.salPay]; let b = 0;
    LG.entries.forEach(e => { if (to && e.date > to) return; e.lines.forEach(l => { if (accs.includes(l.acc) && l.pt === pt && l.pid === pid) b += l.dr - l.cr; }); });
    return r2(b);
  }

  function accBalance(D, LG, id, from, to, cc) {
    const a = D.accounts.find(x => x.id === id); if (!a) return 0;
    const ids = new Set(a.group ? descendants(D, id) : [id]); let b = 0;
    LG.entries.forEach(e => { if ((from && e.date < from) || (to && e.date > to)) return; e.lines.forEach(l => { if (ids.has(l.acc) && (!cc || l.cc === cc)) b += l.dr - l.cr; }); });
    return r2(b);

  function incomeStatement(D, LG, from, to, cc) {

    const cogsParent = (D.accounts.find(a => a.id === M.cogs) || {}).parent;
    const cogsIds = new Set(cogsParent ? descendants(D, cogsParent) : [M.cogs]);
    const leaves = D.accounts.filter(a => !a.group).sort((a, b) => a.code.localeCompare(b.code));
    const rev = [], cogs = [], exp = [];
    leaves.forEach(a => {

  /* ---------- Arabic number to words (tafqeet) ---------- */
  function tafqeet(num, cur) {
    const ones = ['', 'واحد', 'اثنان', 'ثلاثة', 'أربعة', 'خمسة', 'ستة', 'سبعة', 'ثمانية', 'تسعة', 'عشرة', 'أحد عشر', 'اثنا عشر', 'ثلاثة عشر', 'أربعة عشر', 'خمسة عشر', 'ستة عشر', 'سبعة عشر', 'ثمانية عشر', 'تسعة عشر'];
    const tens = ['', '', 'عشرون', 'ثلاثون', 'أربعون', 'خمسون', 'ستون', 'سبعون', 'ثمانون', 'تسعون'];
    const hund = ['', 'مائة', 'مائتان', 'ثلاثمائة', 'أربعمائة', 'خمسمائة', 'ستمائة', 'سبعمائة', 'ثمانمائة', 'تسعمائة'];
    const three = n => { const h = Math.floor(n / 100), r = n % 100; const p = []; if (h) p.push(hund[h]); if (r) { if (r < 20) p.push(ones[r]); else { const o = r % 10, t = Math.floor(r / 10); p.push(o ? ones[o] + ' و' + tens[t] : tens[t]); } } return p.join(' و'); };
    const scales = [['', '', '', ''], ['ألف', 'ألفان', 'آلاف', 'ألفاً'], ['مليون', 'مليونان', 'ملايين', 'مليوناً'], ['مليار', 'ملياران', 'مليارات', 'ملياراً']];
    const words = n => {
      if (n === 0) return 'صفر';
      const parts = []; let i = 0;
      while (n > 0 && i < 4) {
        const g = n % 1000;
        if (g) {
          let w;
          if (i === 0) w = three(g);
          else if (g === 1) w = scales[i][0];
          else if (g === 2) w = scales[i][1];
          else if (g >= 3 && g <= 10) w = three(g) + ' ' + scales[i][2];
          else w = three(g) + ' ' + scales[i][3];
          parts.unshift(w);
        }
        n = Math.floor(n / 1000); i++;
      }
      return parts.join(' و');
    };
    const v = Math.abs(r2(num)); const int = Math.floor(v); const frac = Math.round((v - int) * 100);
    const c = cur || { name: 'ريال سعودي', sub: 'هللة' };
    let s = words(int) + ' ' + c.name;
    if (frac) s += ' و' + words(frac) + ' ' + (c.sub || 'هللة');
    return 'فقط ' + s + ' لا غير';
  }

async function toPDF(html, filename, pageW) {
  if (!window.html2canvas || !window.jspdf) { toast('مكتبة PDF لم تُحمّل بعد، حاول مرة أخرى', 1); return; }
  toast('جارٍ إنشاء ملف PDF…');

  try {
    if (document.fonts && document.fonts.ready) await document.fonts.ready;
    const SC = 2;
    const canvas = await html2canvas(el, { scale: SC, backgroundColor: '#ffffff', useCORS: true, logging: false });
    const top = el.getBoundingClientRect().top;
    const breaks = [...el.querySelectorAll('tr,.tot,.sign,.words,.foot,.meta,.ttl')].map(e => (e.getBoundingClientRect().bottom - top) * SC).sort((a, b) => a - b);
    const forced = [...el.querySelectorAll('.pb')].map(e => (e.getBoundingClientRect().top - top) * SC).sort((a, b) => a - b);
    const PW = pageW || 210, pxmm = canvas.width / PW;

      let cut = Math.min(canvas.height, y + pageH);
      const fb = forced.find(v => v > y + 20 && v < cut);
      if (fb) cut = Math.floor(fb);
      else if (cut < canvas.height) { const b = breaks.filter(v => v > y + 200 && v <= cut).pop(); if (b) cut = Math.ceil(b); }
      const h = cut - y; const pc = document.createElement('canvas'); pc.width = canvas.width; pc.height = h;
      const cx = pc.getContext('2d'); cx.fillStyle = '#fff'; cx.fillRect(0, 0, pc.width, h); cx.drawImage(canvas, 0, y, canvas.width, h, 0, 0, canvas.width, h);
      if (!first) pdf.addPage(); first = false;

      y = cut;
    }
    const n = pdf.getNumberOfPages(); if (!pageW) for (let i = 1; i <= n; i++) { pdf.setPage(i); pdf.setFontSize(8); pdf.setTextColor(140); pdf.text(i + ' / ' + n, 105, 292, { align: 'center' }); }

}

  snap() { const o = {}; C.KEYS.forEach(k => { if (k !== 'log') o[k] = D[k]; }); return JSON.stringify(o); },

function resGross(r) {
  const ls = (r.lines || []).filter(l => l.item);

}
function resAmount(r) {
  const ls = (r.lines || []).filter(l => l.item);
  if (!ls.length) return C.r2(Math.max(0, (+r.amount || 0) - (+r.disc || 0)));
  return C.invTotals({ lines: ls, disc: +r.disc || 0, vatOn: true, vatRate: +D.settings.vat || 0, vatIncl: !!D.settings.posPriceIncl, rate: 1 }).total;

const whenTxt = r => { const d = resAt(r).getTime() - Date.now(); if (d < 0) return 'الآن / متأخر'; const h = Math.floor(d / 3600000), m = Math.round((d % 3600000) / 60000); return h >= 24 ? 'بعد ' + Math.floor(h / 24) + ' يوم' : h ? `بعد ${h} س ${m} د` : `بعد ${m} دقيقة`; };

  const lines = po.lines.filter(l => l.item).map(l => { const it = byId('items', l.item), f = C.unitFactor(it, l.unit), o = (+l.qty || 0) * f; const g = Math.min(o, rec[l.item] || 0); rec[l.item] = (rec[l.item] || 0) - g; ord += o; got += g; return { ...l, ordB: o, recB: g, remB: C.r2(o - g), f }; });
  const inv = D.invoices.find(i => i.po === po.id);

const _toPDF = toPDF;
toPDF = async function (html, filename, pageW) {

  if (!window.html2canvas || !window.jspdf) { toast('مكتبة PDF لم تُحمّل بعد، حاول مرة أخرى', 1); return; }

  stage.querySelectorAll('.lbl').forEach(e => e.style.border = '0');

/* ---------- checks before issuing ---------- */
function zxCheck(inv) {
  const S = D.settings, Z = zxCfg(), e = [], w = [], T = C.invTotals(inv), cust = byId('customers', inv.party) || {};
  const vatOk = v => /^3\d{13}3$/.test(String(v || '').replace(/\s/g, ''));
  if (!vatOk(S.vatNo)) e.push('الرقم الضريبي للمنشأة يجب أن يكون 15 رقماً يبدأ وينتهي بالرقم 3 (بيانات المنشأة)');
  if (!S.crNo) w.push('السجل التجاري للمنشأة غير مُدخل');
  if (!Z.street || !Z.city || !/^\d{4}$/.test(Z.building || '') || !/^\d{5}$/.test(Z.postal || '') || !Z.district) e.push('العنوان الوطني للمنشأة غير مكتمل (الشارع، رقم المبنى 4 أرقام، الحي، المدينة، الرمز البريدي 5 أرقام)');
  if (!T.lines.length) e.push('الفاتورة بلا أسطر');
  if (T.lines.some(l => !(+l.qty > 0))) e.push('سطر بكمية صفر أو سالبة');
  if (zxStd(inv)) {
    if (!vatOk(cust.vat)) e.push('الرقم الضريبي للعميل غير صحيح');
    if (!cust.bStreet || !cust.bCity || !/^\d{4}$/.test(cust.bBuilding || '') || !/^\d{5}$/.test(cust.bPostal || '') || !cust.bDistrict) e.push('عنوان العميل الوطني غير مكتمل — مطلوب للفاتورة الضريبية (B2B)');
  } else if (T.totB >= 1000 && !inv.party) w.push('فاتورة مبسطة بقيمة كبيرة بلا عميل محدد');
  if ((inv.currency || base()) !== 'SAR' && base() !== 'SAR') w.push('العملة الأساسية ليست الريال السعودي');
  if (inv.type === 'sret' && !inv.ref && !inv.retOf) w.push('إشعار دائن بلا رقم الفاتورة الأصلية — أدخله في حقل «رقم مرجعي»');
  if (inv.date > C.today()) e.push('تاريخ الفاتورة في المستقبل');
  return { e, w };
}

/* ---------- issue (UUID + ICV + PIH chain + hash) ---------- */
async function zxIssue(inv) {
  if (inv.zx) return inv.zx;
  const Z = zxCfg(), chk = zxCheck(inv); if (chk.e.length) throw new Error(chk.e[0]);
  const zx = { uuid: uuid4(), icv: (+Z.icv || 0) + 1, pih: Z.pih || ZX0_PIH, std: zxStd(inv), at: Date.now(), status: 'ready', by: st.user ? st.user.id : '' };
  const xml = zxBuild(inv, zx);
  zx.hash = await sha256b64(xml); zx.xml = xml;
  Z.icv = zx.icv; Z.pih = zx.hash; inv.zx = zx;
  return zx;
}
async function zxIssueMany(list) {
  let ok = 0; const bad = [];
  for (const inv of list.sort((a, b) => a.date.localeCompare(b.date) || (a.created || 0) - (b.created || 0) || String(a.no).localeCompare(String(b.no), 'en', { numeric: true }))) {
    try { await zxIssue(inv); ok++; } catch (e) { bad.push(inv.no + ': ' + e.message); }
  }
  return { ok, bad };
}

function custAging(asOf) {
  const lg = G(), M = D.settings.map, by = {};
  lg.entries.forEach(en => { if (en.date > asOf) return; en.lines.forEach(l => { if ((l.acc !== M.ar && l.acc !== M.custAdv) || l.pt !== 'c' || !l.pid) return; const o = by[l.pid] || (by[l.pid] = { dr: [], cr: 0, lastPay: '' }); const dr = +l.dr || 0, cr = +l.cr || 0; if (dr) o.dr.push({ d: en.date, a: dr }); if (cr) { o.cr += cr; if (!o.lastPay || en.date > o.lastPay) o.lastPay = en.date; } }); });
  const now = new Date(asOf + 'T00:00:00');
  return D.customers.map(c => {
    const o = by[c.id] || { dr: [], cr: 0, lastPay: '' }, ob = +c.openBal || 0;
    let left = o.cr + (ob < 0 ? -ob : 0); const b = [0, 0, 0, 0, 0];
    o.dr.sort((x, y) => x.d.localeCompare(y.d)).forEach(x => { const use = Math.min(left, x.a); left -= use; const rem = x.a - use; if (rem <= 0.004) return; const days = Math.floor((now - new Date(x.d + 'T00:00:00')) / 864e5); b[days <= 30 ? 0 : days <= 60 ? 1 : days <= 90 ? 2 : days <= 180 ? 3 : 4] += rem; });
    const bal = C.r2(b.reduce((s, v) => s + v, 0) - left);
    return { c, b: b.map(C.r2), adv: C.r2(left), bal, lastPay: o.lastPay };
  });
}

    `<button class="btn pri" id="bkr-dl">⬇️ تنزيل نسخة الآن</button><button class="btn" id="bkr-pt">نقطة استعادة</button><button class="btn" id="bkr-sn">ذكّرني بعد ساعة</button><button class="btn" id="bkr-no">تجاهل اليوم</button>`);
  ov.querySelector('#bkr-dl').onclick = async () => { closeModal(); await A['bk-exp'](); };
  ov.querySelector('#bkr-pt').onclick = async () => { closeModal(); await A['bk-now'](); };
  ov.querySelector('#bkr-sn').onclick = () => { BKD.set({ snooze: Date.now() + 3600000 }); closeModal(); toast('سنذكّرك بعد ساعة'); };
  ov.querySelector('#bkr-no').onclick = () => { BKD.set({ skip: C.today() }); closeModal(); };
}
let bkBusy = false;
async function bkTick() {
  if (bkBusy || !bkAdmin() || document.hidden) return;
  const s = D.settings, day = BKD.get(), today = C.today(), afterTime = bkNowHM() >= bkAt();
  /* automatic daily file */
  if (s.bkAutoDl && afterTime && day.autoDl !== today && bkDue()) {
    bkBusy = true;
    try { await A['bk-exp'](); if (!bkDue()) { BKD.set({ autoDl: today }); addLog('تنزيل نسخة احتياطية يومية تلقائية'); Store.save(['log']); } } catch (e) { console.warn(e); }
    bkBusy = false; return;
  }
  /* reminder */
  if (!afterTime || !bkDue() || day.skip === today || (day.snooze && day.snooze > Date.now()) || $('#ov')) return;
  if (view() === 'pos' && st.pos && st.pos.o && (st.pos.o.lines || []).length) return;   /* don't interrupt a sale */
  if (day.shown === today && !(day.snooze && day.snooze <= Date.now())) return;
  BKD.set({ shown: today, snooze: 0 });
  bkRemindShow();
}
setTimeout(() => { bkTick(); setInterval(bkTick, 60000); }, 8000);
/* a reminder chip in the top bar while today's copy is still missing */
const _renderBkd = render;
render = function () {
  _renderBkd();
  try {
    const host = $('#who'); if (!host || !bkAdmin()) return;
    let c = $('#bkchip'); const due = bkDays() && bkDue();
    if (!due) { if (c) c.remove(); return; }
    if (!c) { c = document.createElement('span'); c.id = 'bkchip'; host.parentNode.insertBefore(c, host); }
    c.innerHTML = `<button class="btn sm warnb" data-a="bk-exp" title="لم يتم تنزيل نسخة احتياطية ${bkDays() === 1 ? 'اليوم' : 'في المدة المحددة'} — اضغط للتنزيل">🗄️ نسخة اليوم</button>`;
  } catch (e) { }
};
(() => { const s = document.createElement('style'); s.textContent = '.bkd-status{margin-bottom:14px}.bkd-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;margin-top:10px}.bkd-grid div{display:flex;flex-direction:column;gap:3px;padding:10px 12px;border-radius:10px;background:var(--surface-2);border:1px solid var(--border)}.bkd-grid span{font-size:12px;color:var(--muted,#64748b)}.bkd-rem{display:flex;gap:14px;align-items:flex-start}.bkd-ic{font-size:34px;line-height:1}'; document.head.appendChild(s); })();

boot();
</script></body></html>
